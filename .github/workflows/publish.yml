# Publishes the posteverywhere package to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org: add a (pending) trusted publisher with
#   owner: posteverywhere, repository: posteverywhere-python,
#   workflow: publish.yml, environment: pypi
# The release tag must match the version in src/posteverywhere/_version.py
# and pyproject.toml (for example v0.1.0 or 0.1.0 for version 0.1.0).

name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/posteverywhere/
    permissions:
      # Required for PyPI Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
