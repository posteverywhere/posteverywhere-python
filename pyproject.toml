[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "posteverywhere"
version = "0.1.0"
description = "Official Python client for the PostEverywhere API. Schedule and publish posts to Instagram, TikTok, YouTube, LinkedIn, Facebook, X, Threads, Pinterest, Bluesky and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "PostEverywhere", email = "support@posteverywhere.ai" }]
keywords = ["posteverywhere", "social media", "scheduler", "api", "sdk", "instagram", "tiktok", "linkedin", "x", "twitter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://posteverywhere.ai"
Documentation = "https://developers.posteverywhere.ai"
Source = "https://github.com/posteverywhere/posteverywhere-python"
Changelog = "https://github.com/posteverywhere/posteverywhere-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/posteverywhere"]

[tool.hatch.build.targets.sdist]
include = ["src/posteverywhere", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
